{% extends "base.html" %}
{% set fantasy = false %}

{% block content %}
{% include "includes/season_body.html" %}
{% endblock %}

{% block scripts %}
<script src="/assets/js/chart-utils.js"></script>
<script src="/assets/js/season-charts.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const yearData = {{ yearData | tojson }};
    const projectionSystems = {{ site.meta.projection_systems | tojson }};
    const pools = {{ pools | tojson }};
    bindSeasonCharts(yearData, projectionSystems, pools, false);
    document.querySelectorAll('.chart-section').forEach(section => {
      const metricSelect = section.querySelector('.metric-select');
      const adjustmentSelect = section.querySelector('.adjustment-select');
      if (!metricSelect) return;
      function updateVisibility() {
        const selectedMetric = metricSelect.value;
        const selectedAdjustment = adjustmentSelect ? adjustmentSelect.value : 'raw';
        section.querySelectorAll('.chart-container').forEach(container => {
          const isVolume = container.dataset.volume === 'true';
          const shouldShow = container.dataset.metric === selectedMetric && (isVolume || container.dataset.adjustment === selectedAdjustment);
          container.style.display = shouldShow ? 'block' : 'none';
        });
      }
      metricSelect.addEventListener('change', updateVisibility);
      if (adjustmentSelect) adjustmentSelect.addEventListener('change', updateVisibility);
      updateVisibility();
    });
  });
</script>
{% endblock %}
