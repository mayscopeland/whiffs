<nav class="mb-8 text-sm text-slate-600 dark:text-slate-400 space-y-1" aria-label="Stat categories">
  {% for pool in pools %}
  <div class="flex flex-wrap items-baseline gap-x-1.5 gap-y-0.5">
    <span class="font-medium text-slate-800 dark:text-slate-200 shrink-0">{{ pool.label }}:</span>
    <a href="#{{ pool.key }}-{{ pool.volume.stat }}" class="text-blue-600 dark:text-blue-400 hover:underline">{{ pool.volume.name }}</a>
    {% for rate in pool.rates %}
      <a href="#{{ pool.key }}-{{ rate.stat | replace('/', '-') }}" class="text-blue-600 dark:text-blue-400 hover:underline">{{ rate.name }}</a>
    {% endfor %}
  </div>
  {% endfor %}
</nav>
